<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Zenei Adatbázis & Szeletelők</title>
    <style>
        body { font-family: sans-serif; margin: 30px; background-color: #f9f9f9; color: #333; }
        h1 { color: #2c3e50; }
        
        /* A szűrők doboza */
        .szurok-kontener {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .szuro-doboz {
            display: flex;
            flex-direction: column;
        }
        .szuro-doboz label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input { 
            padding: 10px; 
            width: 220px; 
            font-size: 15px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }

        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2980b9; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h1>Zenei Kapcsolati Háló & Adatbázis</h1>
    <p>Használd az alábbi szűrőket (szeletelőket) a kereséshez:</p>

    <!-- Szeletelők / Szűrők mezői -->
    <div class="szurok-kontener">
        <div class="szuro-doboz">
            <label for="szuresCim">Szűrés Címre:</label>
            <input type="text" id="szuresCim" placeholder="Pl. Zenemű..." onkeyup="adatokatSzuroEsKirajzol()">
        </div>
        <div class="szuro-doboz">
            <label for="szuresZeneszerzo">Szűrés Zeneszerzőre:</label>
            <input type="text" id="szuresZeneszerzo" placeholder="Pl. Én (AI)..." onkeyup="adatokatSzuroEsKirajzol()">
        </div>
        <div class="szuro-doboz">
            <label for="szuresSzovegiro">Szűrés Szövegíróra:</label>
            <input type="text" id="szuresSzovegiro" placeholder="Pl. Vica..." onkeyup="adatokatSzuroEsKirajzol()">
        </div>
    </div>

    <!-- Táblázat -->
    <table id="zeneTabla">
        <thead>
            <tr>
                <th>Zenemű Címe</th>
                <th>Zeneszerző</th>
                <th>Dalszövegíró</th>
            </tr>
        </thead>
        <tbody id="tablaTorzs">
            <!-- Ide teszi be a JavaScript a szűrt adatokat -->
        </tbody>
    </table>

    <!-- Betöltjük az adatokat -->
    <script src="adat.js"></script>

    <script>
        // Amint betöltődik az oldal, megjelenítjük az összes adatot
        window.onload = function() {
            tablaFeltoltes(zeneiAdatok);
        };

        // Táblázat feltöltő függvény
        function tablaFeltoltes(adatLista) {
            const tbody = document.getElementById('tablaTorzs');
            tbody.innerHTML = ""; 

            if (adatLista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: #888;">Nincs találat a megadott szűrésre.</td></tr>`;
                return;
            }

            adatLista.forEach(zenemu => {
                let sor = `<tr>
                    <td>${zenemu.cim}</td>
                    <td>${zenemu.zeneszerzo}</td>
                    <td>${zenemu.szovegiro}</td>
                </tr>`;
                tbody.innerHTML += sor;
            });
        }

        // A szűrő / szeletelő logika
        function adatokatSzuroEsKirajzol() {
            // Kiolvassuk a 3 mező értékét, és kisbetűssé alakítjuk (hogy a kis- és nagybetű ne számítson)
            let cimFilt = document.getElementById("szuresCim").value.toLowerCase();
            let zeneFilt = document.getElementById("szuresZeneszerzo").value.toLowerCase();
            let szovegFilt = document.getElementById("szuresSzovegiro").value.toLowerCase();

            // Szűrjük a tömböt: csak azok maradhatnak, amelyek mindhárom mezőre illeszkednek
            let szurtAdatok = zeneiAdatok.filter(item => {
                let matchCim = item.cim.toLowerCase().includes(cimFilt);
                let matchZene = item.zeneszerzo.toLowerCase().includes(zeneFilt);
                let matchSzoveg = item.szovegiro.toLowerCase().includes(szovegFilt);
                
                return matchCim && matchZene && matchSzoveg;
            });

            // Újrarajzoljuk a táblázatot a szűrt listával
            tablaFeltoltes(szurtAdatok);
        }
    </script>

</body>
</html>
