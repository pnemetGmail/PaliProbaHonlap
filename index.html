<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Zenei Adatbázis - Kereső és Szeletelők</title>
    <style>
        body { font-family: sans-serif; margin: 30px; background-color: #f9f9f9; color: #333; }
        h1 { color: #2c3e50; }
        
        /* A vezérlőpult doboza */
        .vezerlo-panel {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .fo-kereso {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .szeletelok-sor {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .szeletelo-doboz {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }
        .szeletelo-doboz label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        select {
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
        }

        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2980b9; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

    <h1>Zenei Adatbázis & Szeletelők</h1>
    <p>Használd a szabad keresőt vagy kattints a szeletelőkre a szűréshez:</p>

    <!-- Vezérlőpanel: Fő kereső + Szeletelők -->
    <div class="vezerlo-panel">
        <!-- Google-szerű fő keresőmező -->
        <input type="text" id="foKereso" class="fo-kereso" placeholder="🔍 Szabad keresés (cím, zeneszerző, szövegíró)..." onkeyup="szuresEsKirajzol()">

        <!-- Szeletelők (Lenyíló dobozok) -->
        <div class="szeletelok-sor">
            <div class="szeletelo-doboz">
                <label for="szSzerzo">Zeneszerző szeletelő:</label>
                <select id="szSzerzo" onchange="szuresEsKirajzol()">
                    <option value="">-- Összes zeneszerző --</option>
                </select>
            </div>
            <div class="szeletelo-doboz">
                <label for="szSzovegiro">Szövegíró szeletelő:</label>
                <select id="szSzovegiro" onchange="szuresEsKirajzol()">
                    <option value="">-- Összes szövegíró --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Táblázat -->
    <table id="zeneTabla">
        <thead>
            <tr>
                <th>Zenemű Címe</th>
                <th>Zeneszerző</th>
                <th>Dalszövegíró</th>
            </tr>
        </thead>
        <tbody id="tablaTorzs">
            <!-- Ide kerülnek a szűrt adatok -->
        </tbody>
    </table>

    <!-- Betöltjük az adatokat -->
    <script src="adat.js"></script>

    <script>
        // Amint betöltődik az oldal
        window.onload = function() {
            szuroketFeltolt();
            tablaFeltoltes(zeneiAdatok);
        };

        // Automatikusan feltölti a szeletelőket (lenyíló listákat) az adatok alapján, hogy ne kelljen kézzel írogatni
        function szuroketFeltolt() {
            let szerzok = [...new Set(zeneiAdatok.map(item => item.zeneszerzo))];
            let szovegirok = [...new Set(zeneiAdatok.map(item => item.szovegiro))];

            let szerzoSelect = document.getElementById("szSzerzo");
            szerzok.forEach(szerzo => {
                szerzoSelect.innerHTML += `<option value="${szerzo}">${szerzo}</option>`;
            });

            let szovegiroSelect = document.getElementById("szSzovegiro");
            szovegirok.forEach(szovegiro => {
                szovegiroSelect.innerHTML += `<option value="${szovegiro}">${szovegiro}</option>`;
            });
        }

        // Táblázat kirajzolása
        function tablaFeltoltes(adatLista) {
            const tbody = document.getElementById('tablaTorzs');
            tbody.innerHTML = ""; 

            if (adatLista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color: #888;">Nincs találat a megadott szűrésre.</td></tr>`;
                return;
            }

            adatLista.forEach(zenemu => {
                let sor = `<tr>
                    <td>${zenemu.cim}</td>
                    <td>${zenemu.zeneszerzo}</td>
                    <td>${zenemu.szovegiro}</td>
                </tr>`;
                tbody.innerHTML += sor;
            });
        }

        // A közös szűrő motor (Fő kereső + Szeletelők együtt)
        function szuresEsKirajzol() {
            let keresettSzo = document.getElementById("foKereso").value.toLowerCase();
            let kivalasztottSzerzo = document.getElementById("szSzerzo").value;
            let kivalasztottSzovegiro = document.getElementById("szSzovegiro").value;

            let szurtAdatok = zeneiAdatok.filter(item => {
                // 1. Feltétel: Illeszkedik a szabad keresőre (bármelyik mezőben benne van)
                let egyezikKereso = 
                    item.cim.toLowerCase().includes(keresettSzo) ||
                    item.zeneszerzo.toLowerCase().includes(keresettSzo) ||
                    item.szovegiro.toLowerCase().includes(keresettSzo);

                // 2. Feltétel: Megfelel a zeneszerző szeletelőnek (ha ki van választva valaki)
                let egyezikSzerzo = (kivalasztottSzerzo === "") || (item.zeneszerzo === kivalasztottSzerzo);

                // 3. Feltétel: Megfelel a szövegíró szeletelőnek (ha ki van választva valaki)
                let egyezikSzovegiro = (kivalasztottSzovegiro === "") || (item.szovegiro === kivalasztottSzovegiro);

                // Mindhárom feltételnek teljesülnie kell egyszerre
                return egyezikKereso && egyezikSzerzo && egyezikSzovegiro;
            });

            tablaFeltoltes(szurtAdatok);
        }
    </script>

</body>
</html>
